änger", "q": "Was bedeutet Durchgang bei einer elektrischen Prüfung?", "a": ["Ein leitender elektrischer Weg ist vorhanden", "Die Anlage hat 230 V", "Der Heizkreis ist entlüftet", "Das Sicherheitsventil ist offen"], "c": 0, "e": "Durchgang bedeutet einen niederohmigen leitenden Weg.", "v": "multimeter"}, {"mode": "anfänger", "q": "Welche Komponente bewegt bei einer motorischen 3-Wege-Ventilbaugruppe die Ventilstellung?", "a": ["Der Stellantrieb", "Das Manometer", "Das MAG", "Der Schmutzfänger"], "c": 0, "e": "Der Stellantrieb verändert die Ventilstellung.", "v": "valve"}, {"mode": "anfänger", "q": "Wozu dient ein Sicherheitsventil im Heizkreis?", "a": ["Zum Schutz vor unzulässigem Überdruck", "Zum Entlüften des Brenners", "Zur Regelung der Heizkurve", "Zur Messung des Volumenstroms"], "c": 0, "e": "Das Sicherheitsventil begrenzt gefährlichen Überdruck.", "v": "safety"}, {"mode": "anfänger", "q": "Ein Warmwasserspeicher bleibt kalt, obwohl der Kessel warm ist. Was sollte man prüfen?", "a": ["Ladepumpe und Umschaltung zum Speicher prüfen", "Nur den Außentemperaturfühler tauschen", "Heizkörper entlüften", "MAG absperren"], "c": 0, "e": "Die Wärme muss vom Kessel in den Speicher übertragen werden.", "v": "dhw"}, {"mode": "anfänger", "q": "Welche Einheit wird häufig für den Volumenstrom verwendet?", "a": ["m³/h", "bar", "Ω", "V"], "c": 0, "e": "m³/h ist eine übliche Einheit für Volumenstrom.", "v": "flow"}, {"mode": "anfänger", "q": "Welche Einheit gehört zum elektrischen Widerstand?", "a": ["Ω", "bar", "m³/h", "kW"], "c": 0, "e": "Der elektrische Widerstand wird in Ohm angegeben.", "v": "multimeter"}, {"mode": "anfänger", "q": "Was passiert bei einem typischen NTC, wenn die Temperatur steigt?", "a": ["Der Widerstand sinkt", "Der Widerstand steigt immer auf unendlich", "Der Widerstand bleibt exakt gleich", "Der Widerstand wird zwingend 0 Ω"], "c": 0, "e": "NTC bedeutet negativer Temperaturkoeffizient.", "v": "ntc"}, {"mode": "anfänger", "q": "Ein Thermostatventil ist ges chmutzfänger erzeugt einen erheblichen Druckverlust", "Das MAG ist zwingend defekt", "Der Außentemperaturfühler ist falsch", "Die Kesseltemperatur ist grundsätzlich zu niedrig"], "c": 0, "e": "0,9 bar Differenz über dem Filter ist ein deutlicher Hinweis auf eine hydraulische Drosselung.", "v": "filter"}, {"mode": "schwer", "q": "Eine Pumpe erhält 230 V, läuft hörbar, liefert aber nahezu keinen Volumenstrom. Welche Diagnose ist am sinnvollsten?", "a": ["Rotor/Pumpenhydraulik und Absperrungen prüfen", "NTC am Speicher ersetzen", "MAG-Vordruck erhöhen", "Gasdruck am Brenner erhöhen"], "c": 0, "e": "Elektrische Versorgung allein beweist keine ausreichende hydraulische Förderung.", "v": "pump"}, {"mode": "schwer", "q": "Beim Aufheizen steigt der Druck von 1,2 auf 2,8 bar und das Sicherheitsventil tropft. Welche Ursache muss gezielt geprüft werden?", "a": ["MAG-Vordruck, Membran und Anlagenfüllzustand", "Außentemperaturfühler", "Brennerdüse", "Raumthermostat"], "c": 0, "e": "Das starke Druckanstiegsverhalten weist auf ein Problem mit dem Ausdehnungsvolumen hin.", "v": "mag"}, {"mode": "schwer", "q": "Ein NTC zeigt einen plausiblen Widerstand, die Regelung zeigt aber eine deutlich falsche Temperatur. Was ist der nächste sinnvolle Schritt?", "a": ["Kennlinie, Leitungswiderstand, Steckverbindung und Referenztemperatur prüfen", "Pumpe sofort ersetzen", "MAG entleeren", "Sicherheitsventil austauschen"], "c": 0, "e": "Der Sensorwert muss gegen Kennlinie und reale Temperatur plausibilisiert werden.", "v": "ntc"}, {"mode": "schwer", "q": "Bei einer Brennerstörung wird keine Brennerfreigabe ausgegeben. Was sollte vor dem Brennerzerlegen geprüft werden?", "a": ["Anforderung sowie Sicherheits- und Freigabekette systematisch verfolgen", "Düse sofort tauschen", "Flammensensor überbrücken", "Gasdruck pauschal erhöhen"], "c": 0, "e": "Fehlt die Freigabe, liegt die Ursache häufig in der Anforderung oder Verriegelung.", "v": "burner"}, {"mode": "schwer", "q": "Der Brenner startet, das Fla const $=x=>document.getElementById(x);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(m){mode=m;qs=shuffle(DATA.filter(x=>x.mode===m)).slice(0,20);i=0;score=0;streak=0;$('menu').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');$('back').style.display='block';$('tag').textContent=m==='anfänger'?'ANFÄNGER':'SCHWER';show()}
function show(){clearInterval(timer);answered=false;time=30;let x=qs[i];$('prog').textContent=`Frage ${i+1} / 20`;$('score').textContent=score+' Punkte';$('q').textContent=x.q;$('exp').classList.add('hidden');$('next').classList.add('hidden');$('time').textContent=time+' s';$('bar').style.width='100%';$('scene').innerHTML=scene(x.v);let o=x.a.map((t,k)=>({t,k})).sort(()=>Math.random()-.5);$('answers').innerHTML=o.map((z,n)=>`<button class="answer" data-k="${z.k}"><b>${String.fromCharCode(65+n)}</b><span>${z.t}</span></button>`).join('');document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>answer(+b.dataset.k,b));timer=setInterval(()=>{time--;$('time').textContent=time+' s';$('bar').style.width=(time/30*100)+'%';if(time<=0)answer(-1,null)},1000)}
function answer(k,btn){if(answered)return;answered=true;clearInterval(timer);let x=qs[i],ok=k===x.c;if(ok){score+=100+time*3+streak*20;streak++}else streak=0;$('score').textContent=score+' Punkte';document.querySelectorAll('.answer').forEach(b=>{b.disabled=true;let n=+b.dataset.k;if(n===x.c)b.classList.add('correct');if(btn&&b===btn&&!ok)b.classList.add('wrong')});$('exp').innerHTML=(ok?'<b>✓ Richtig.</b> ':'<b>✗ Falsch.</b> ')+x.e;$('exp').classList.remove('hidden');$('next').classList.remove('hidden')}
$('next').onclick=()=>{i++;i<20?show():finish()};$('back').onclick=()=>{if(confirm('Quiz verlassen und zurück zum Menü?'))location.reload()};
function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('res').innerHTML=`<div class="resultScore">${score} Punkte</div><p>20 Fragen im <b>${mode==='anfänger'?'Anfänger-Modus':'Schwer-Modus'}</b> abgeschlossen.</p>`}
